name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  client:
    name: client (lint, typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint --workspace=client

      - name: Typecheck
        run: npx tsc -b
        working-directory: client

      - name: Build
        run: npm run build --workspace=client

  server:
    name: server (typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck --workspace=server
